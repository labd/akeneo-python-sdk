# Packaging is maintained by hand: setup.py, requirements.txt, etc. are listed
# in .openapi-generator-ignore so `make generate` does not recreate them.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akeneo-python-sdk"
version = "1.0.0"
description = "Akeneo PIM REST API"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "OpenAPI Generator community", email = "team@openapitools.org" },
]
keywords = ["OpenAPI", "OpenAPI-Generator", "Akeneo PIM REST API"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "urllib3>=1.25.3",
  "python-dateutil",
  # The python-nextgen generator (6.4.0) emits pydantic v1 models; with
  # pydantic 2 aliased fields such as `_embedded` are silently dropped.
  "pydantic>=1.10.2,<2",
  "aenum",
  "typing-extensions",
]

[project.urls]
Homepage = "https://github.com/labd/akeneo-python-sdk"

[dependency-groups]
dev = [{ include-group = "test" }]
test = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-randomly>=5.0.0",
  "ruff>=0.17.2",
]

[tool.hatch.build.targets.wheel]
packages = ["akeneo"]

[tool.hatch.build.targets.sdist]
include = ["akeneo", "test", "README.md"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["akeneo"]

[tool.ruff.lint.per-file-ignores]
# Generated by openapi-generator
"akeneo/api_client.py" = ["E721"]
"akeneo/rest.py" = ["F841"]
