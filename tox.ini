[tox]
envlist = py{311,312,313,314}, lint

[testenv]
deps=-r{toxinidir}/requirements.txt
     -r{toxinidir}/test-requirements.txt

commands=
   pytest --cov=akeneo

[testenv:lint]
basepython = python3.13
deps = ruff==0.17.2
skip_install = true
commands =
    ruff format --check akeneo test
    ruff check akeneo test
